# FrameLearn 配置文件
# 敏感信息请放在 .env 文件中

# ═══════════════════════════════════════════════════════════════════
# 一、文本模式配置 [text]
# ═══════════════════════════════════════════════════════════════════

[text]
# TEXT 场景：命令解析（可选）、ask 对话、文档生成
# 统一使用 API 模式（直接调用 LLM API）
text_mode = "api"

# 文本模型 provider
provider = "claude"

# 文本模型
model = "MiniMax-M3"

# 自定义 endpoint（Anthropic-compatible 代理）
base_url = "https://api.minimaxi.com/anthropic"


# ═══════════════════════════════════════════════════════════════════
# 二、视觉（Vision）模式配置 [vision]
# ═══════════════════════════════════════════════════════════════════

[vision]
# VISION 场景：视频关键帧分析、图片理解
# 统一使用 API 模式
vision_mode = "api"

# Vision API 配置
vision_provider = "siliconflow"
vision_model = "Qwen/Qwen3-VL-8B-Instruct"

# Vision Agent 工具调用循环最大重试次数（capture_frame 的上限）
vision_agent_max_retries = 5


# ═══════════════════════════════════════════════════════════════════
# 三、隐私提示配置 [privacy]
# ═══════════════════════════════════════════════════════════════════

[privacy]
# 每次任务前显示实际使用的外部服务
privacy_hints = false


# ═══════════════════════════════════════════════════════════════════
# 四、个性化风格配置 [style]
# ═══════════════════════════════════════════════════════════════════

[style]
# 语言风格：relaxed（轻松）/ balanced（平衡）/ professional（专业）
tone = "balanced"

# 详略程度：brief（简略）/ standard（标准）/ detailed（详实）
detail_level = "detailed"


# ═══════════════════════════════════════════════════════════════════
# 五、ASR 音频转文字配置 [asr]
# ═══════════════════════════════════════════════════════════════════

[asr]
# ASR 场景：音频转文字（只支持 api）
mode = "api"

# 可选：siliconflow（无时间戳，简单）/ dashscope（词级时间戳，推荐长视频）
provider = "dashscope"
# dashscope 可选模型：
#   qwen-audio-3.0-asr-flash-filetrans   推荐，最长12小时，时间戳固定开启
model = "qwen-audio-3.0-asr-flash-filetrans"
language_hints = ["zh", "en"]
diarization_enabled = false
disfluency_removal = false
chunk_duration = 1800          # 分段时长（秒，默认 30 分钟）
max_workers = 2                # 并行上传和提交任务数（降低以避免超时）
overlap = 2                    # 第一版不做重叠
poll_interval = 5              # 轮询间隔（秒）
poll_timeout = 3600            # 单段最大等待时间（秒）
vocabulary_id = ""             # 可选热词表 ID（留空不使用）
keep_temp_files = true         # true 时保留切片文件到 output/任务名/temp/，方便调试


[asr.oss]
bucket = "framelearn-audio"   # 阿里云 OSS Bucket 名称（dashscope 时必填）
region = "oss-cn-beijing"     # OSS 节点
prefix = "framelearn-audio/"  # 上传路径前缀
url_ttl = 86400                # 签名 URL 有效期（秒，默认 24 小时）


# ═══════════════════════════════════════════════════════════════════
# 六、字幕清洗配置 [subtitle]
# ═══════════════════════════════════════════════════════════════════

[subtitle]
# 是否去除括号内容（[音乐]、（掌声）等）
remove_brackets = true

# 是否合并重复行
merge_duplicates = true

# 时间戳对齐误差容忍（秒）
timestamp_tolerance = 0.5


# ═══════════════════════════════════════════════════════════════════
# 七、视频处理配置 [video]
# ═══════════════════════════════════════════════════════════════════

[video]
# 输出目录（处理完的视频教材保存位置）
output_dir = "./output"

# 场景检测阈值（0.0-1.0，越小越敏感，抽帧越多）
scene_threshold = 0.4

# 关键帧去重阈值（0.0-1.0，pHash 相似度 > 此值视为重复帧）
# 0.95 = 像素差异很小的图才去重；0.7 = 同一张幻灯片不同字号的也合并
similarity_threshold = 0.95

# 保底抽帧间隔（秒，即使无场景切换也定时抽一帧）
fallback_interval = 30

# 最大关键帧数量（避免超长视频生成过多图片）
max_keyframes = 100

# 图片质量（1-100，JPEG 压缩质量）
image_quality = 85

# 是否保留临时文件（调试时可开启）
keep_temp_files = true


# ═══════════════════════════════════════════════════════════════════
# 八、Agent 决策配置[agent]
# ═══════════════════════════════════════════════════════════════════

[agent]
# true = LLM 逐帧决策截哪里
keyframe_selection = true

# true = 生成后 LLM 评审质量，不合格自动重试（最多 3 次）
quality_review = false

# 质量评审升级模型（quality_review = true 时，第 3 次重试用此模型）
upgrade_model = ""   # 留空则不升级，例如 "qwen3-vl-32b-instruct"


# ═══════════════════════════════════════════════════════════════════
# 九、分块 LLM 文档生成配置（chunked-llm-doc-gen）
# ═══════════════════════════════════════════════════════════════════

[chunking]
# 每个 chunk 对应的视频时长（分钟）。30 分钟视频 = 1 段，60 分钟 = 2 段
segment_minutes = 30

# 每个 chunk 最多给视觉模型看的图片数（Stage1 / Stage2 上限）
max_images_per_chunk = 50

# 文本清洗 + 视觉模型 并发上限（避免 provider 限流）
concurrency = 5

[text_clean]
# 文本 LLM 清洗口水词时的硬下限词表
filler_words = [
    "那么",
    "就是说",
    "大家注意",
    "咱们",
    "啊",
    "嗯",
    "这个",
    "那个",
    "对吧",
    "就是说啊",
]

[doc_gen]
# SRT 式 + 插图 的输出文件名（保留 SRT 原结构，在对应段后插入图片引用）
srt_filename = "srt_picture.md"

# 博客式 + 插图 的输出文件名（Stage1 生成的博客 markdown + 图片）
blog_filename = "blog.md"

[heuristic]
# 启发式截帧：场景检测阈值（0.0-1.0，越小越敏感）
scene_threshold = 0.4

# 启发式截帧：pHash 去重阈值（> 此值视为重复）
similarity_threshold = 0.85
