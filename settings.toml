# FrameLearn 配置文件
# 敏感信息请放在 .env 文件中

# ═══════════════════════════════════════════════════════════════════
# 运行模式配置
# ═══════════════════════════════════════════════════════════════════

[runtime]
# TEXT 场景：命令解析（可选）、ask 对话、文档生成
# 可选：appserver（通过 codex app-server）/ api（直接调用 LLM API）
text_mode = "appserver"

# VISION 场景：视频关键帧分析、图片理解
# 可选：appserver / api
vision_mode = "api"

# Vision API 模式配置（当 vision_mode = "api" 时生效）
vision_provider = "siliconflow"
vision_model = "Qwen/Qwen3-VL-32B-Instruct"

# ASR 场景：音频转文字（只支持 api）
asr_mode = "api"
asr_provider = "dashscope"


# ═══════════════════════════════════════════════════════════════════
# App-Server 配置（当 *_mode = "appserver" 时生效）
# ═══════════════════════════════════════════════════════════════════

[appserver]
# codex CLI 路径（默认从 PATH 找）
command = ["codex", "app-server"]

# 工作目录（相对于当前目录，或绝对路径）
workspace = "."

# 审批策略
# 可选：auto_accept（自动允许所有操作）/ interactive（每次询问）/ auto_decline（拒绝所有）
approval_policy = "interactive"


# ═══════════════════════════════════════════════════════════════════
# ASR 配置（音频转文字）
# ═══════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════
# 视频处理配置
# ═══════════════════════════════════════════════════════════════════

[video]
# 输出目录（处理完的视频教材保存位置）
output_dir = "./output"

# 场景检测阈值（0.0-1.0，越小越敏感，抽帧越多）
scene_threshold = 0.3

# 保底抽帧间隔（秒，即使无场景切换也定时抽一帧）
fallback_interval = 30

# 最大关键帧数量（避免超长视频生成过多图片）
max_keyframes = 100

# 图片质量（1-100，JPEG 压缩质量）
image_quality = 85

# 是否保留临时文件（调试时可开启）
keep_temp_files = true


# ═══════════════════════════════════════════════════════════════════
# 字幕清洗配置
# ═══════════════════════════════════════════════════════════════════

[subtitle]
# 是否去除括号内容（[音乐]、（掌声）等）
remove_brackets = true

# 是否合并重复行
merge_duplicates = true

# 时间戳对齐误差容忍（秒）
timestamp_tolerance = 0.5


# ═══════════════════════════════════════════════════════════════════
# 个性化生成配置
# ═══════════════════════════════════════════════════════════════════

[style]
# 语言风格：relaxed（轻松）/ balanced（平衡）/ professional（专业）
tone = "balanced"

# 详略程度：brief（简略）/ standard（标准）/ detailed（详实）
detail_level = "detailed"

[doc_generation]
# 文档生成模式：
#   visual_script - 顺序图文讲稿（保留讲解顺序，不重排）
#   notes         - 课堂笔记（bullet points）
#   textbook      - 正式教材（知识点重排）
mode = "visual_script"

# 分段时长（秒），用于长视频分段生成
segment_duration = 90

# 每段最多关键帧数
max_keyframes_per_segment = 10


# ═══════════════════════════════════════════════════════════════════
# Agent 配置（LLM 决策模式，默认关闭以控制成本）
# ═══════════════════════════════════════════════════════════════════

[agent]
# true = LLM 逐帧决策截哪里（精准但慢，每帧多 2 次 LLM 调用）
keyframe_selection = false

# true = 生成后 LLM 评审质量，不合格自动重试（最多 3 次）
quality_review = false

# 质量评审升级模型（quality_review = true 时，第 3 次重试用此模型）
upgrade_model = ""   # 留空则不升级，例如 "qwen3-vl-32b-instruct"


# ═══════════════════════════════════════════════════════════════════
# ASR 模型（音频转文字）
# ═══════════════════════════════════════════════════════════════════

[asr]
# 可选：siliconflow（无时间戳，简单）/ dashscope（词级时间戳，推荐长视频）
provider = "dashscope"
# dashscope 可选模型：
#   qwen-audio-3.0-asr-flash-filetrans   推荐，最长12小时，时间戳固定开启
model = "qwen-audio-3.0-asr-flash-filetrans"
language_hints = ["zh", "en"]
diarization_enabled = false
disfluency_removal = false
chunk_duration = 1800          # 分段时长（秒，默认 30 分钟）
max_workers = 2                # 并行上传和提交任务数（降低以避免超时）
overlap = 2                    # 第一版不做重叠
poll_interval = 5              # 轮询间隔（秒）
poll_timeout = 3600            # 单段最大等待时间（秒）
vocabulary_id = ""             # 可选热词表 ID（留空不使用）
keep_temp_files = true         # true 时保留切片文件到 output/任务名/temp/，方便调试



[asr.oss]
bucket = "framelearn-audio"   # 阿里云 OSS Bucket 名称（dashscope 时必填）
region = "oss-cn-beijing"     # OSS 节点
prefix = "framelearn-audio/"  # 上传路径前缀
url_ttl = 86400                # 签名 URL 有效期（秒，默认 24 小时）
