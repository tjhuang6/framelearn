# FrameLearn 配置文件
# 敏感信息请放在 .env 文件中

# ═══════════════════════════════════════════════════════════════════
# 一、文本模式配置 [text]
# ═══════════════════════════════════════════════════════════════════

[text]
# TEXT 场景：命令解析（可选）、ask 对话、文档生成
# 统一使用 API 模式（直接调用 LLM API）
text_mode = "api"

# 文本模型 provider（统一工厂 framelearn.llm 会读取此值）
# 可选：deepseek / minimax / claude / openai / openrouter /
#       kimi / moonshot / zhipu / siliconflow / gemini / dashscope
# 所有内置 provider 都走非 Responses 协议：
#   openai_chat（/chat/completions）、anthropic（/v1/messages）、
#   gemini（:generateContent）
# 若 MiniMax 有独立 key，可改成 provider = "minimax" 并在 .env 设置
# MINIMAX_API_KEY；当前配置继续使用 claude 协议入口 + TEXT_API_KEY。
provider = "claude"

# 文本模型
model = "MiniMax-M3"

# 自定义 endpoint
base_url = "https://api.minimaxi.com/anthropic"


# ═══════════════════════════════════════════════════════════════════
# 二、视觉（Vision）模式配置 [vision]
# ═══════════════════════════════════════════════════════════════════

[vision]
# VISION 场景：视频关键帧分析、图片理解
# 统一使用 API 模式
vision_mode = "api"

# Vision API 配置（统一工厂 framelearn.llm 会读取此值）
# vision_provider 可选：siliconflow / minimax / claude / openai /
#   openrouter / kimi / zhipu / gemini / dashscope
# 注意：已知 text-only 模型（如 deepseek-chat）会被工厂拒绝。
# 所有内置 provider 都走非 Responses 协议。
vision_provider = "siliconflow"
vision_model = "Qwen/Qwen3-VL-32B-Instruct"


# ═══════════════════════════════════════════════════════════════════
# 三、隐私提示配置 [privacy]
# ═══════════════════════════════════════════════════════════════════

[privacy]
# 每次任务前显示实际使用的外部服务
privacy_hints = false


# ═══════════════════════════════════════════════════════════════════
# 四、个性化风格配置 [style]
# ═══════════════════════════════════════════════════════════════════

[style]
# 语言风格：relaxed（轻松）/ balanced（平衡）/ professional（专业）
tone = "balanced"

# 详略程度：brief（简略）/ standard（标准）/ detailed（详实）
detail_level = "detailed"


# ═══════════════════════════════════════════════════════════════════
# 五、ASR 音频转文字配置 [asr]
# ═══════════════════════════════════════════════════════════════════

[asr]
# ASR 场景：音频转文字（只支持 api）
mode = "api"

# 可选：siliconflow（无时间戳，简单）/ dashscope（词级时间戳，推荐长视频）
provider = "dashscope"
# dashscope 可选模型：
#   qwen-audio-3.0-asr-flash-filetrans   推荐，最长12小时，时间戳固定开启
model = "qwen-audio-3.0-asr-flash-filetrans"
language_hints = ["zh", "en"]
diarization_enabled = false
disfluency_removal = false
chunk_duration = 300          # 分段时长（秒，默认 30 分钟）
max_workers = 2                # 并行上传和提交任务数（降低以避免超时）
overlap = 2                    # 第一版不做重叠
poll_interval = 5              # 轮询间隔（秒）
poll_timeout = 3600            # 单段最大等待时间（秒）
vocabulary_id = ""             # 可选热词表 ID（留空不使用）
keep_temp_files = false        # true 时保留切片文件到 output/任务名/temp/，方便调试


[asr.oss]
bucket = "framelearn-audio"   # 阿里云 OSS Bucket 名称（dashscope 时必填）
region = "oss-cn-beijing"     # OSS 节点
prefix = "framelearn-audio/"  # 上传路径前缀
url_ttl = 86400                # 签名 URL 有效期（秒，默认 24 小时）


# ═══════════════════════════════════════════════════════════════════
# 六、字幕清洗配置 [subtitle]
# ═══════════════════════════════════════════════════════════════════

[subtitle]
# 是否去除括号内容（[音乐]、（掌声）等）
remove_brackets = true

# 是否合并重复行
merge_duplicates = true

# 时间戳对齐误差容忍（秒）
timestamp_tolerance = 0.5


# ═══════════════════════════════════════════════════════════════════
# 七、视频输出配置 [video]
# ═══════════════════════════════════════════════════════════════════

[video]
# 输出目录（处理完的视频教材保存位置）
output_dir = "./output"

# 是否保留临时文件（调试时可开启）
keep_temp_files = false


# ═══════════════════════════════════════════════════════════════════
# 八、在线视频下载配置 [download]
# ═══════════════════════════════════════════════════════════════════

[download]
# 在线视频缓存目录（下载后复用，避免重复下载）
download_dir = "./downloads"

# 下载代理，例如 http://127.0.0.1:7890；留空则使用 HTTP_PROXY/HTTPS_PROXY
proxy = ""

# 各平台 Cookie 建议配置在 .env：
#   BILIBILI_COOKIE    B 站 SESSDATA（可提升画质/解锁字幕）
#   YOUTUBE_COOKIE     YouTube cookies.txt 路径或整段 Cookie
#   DOUYIN_COOKIE      抖音登录/访客 Cookie（接口风控时使用）
#   KUAISHOU_COOKIE    快手登录 Cookie（接口触发验证码时必需）

# 在线字幕优先级：
#   YouTube → Supadata 原生英文 transcript（youtube-digest 方式）
#             → yt-dlp 字幕 → ASR 兜底
#   Bilibili → B 站官方字幕（Bilitato 的 player/v2 方式，中文优先）
#             → yt-dlp 字幕 → ASR 兜底
# Supadata key 配置在 .env 的 SUPADATA_API_KEY。

# ═══════════════════════════════════════════════════════════════════
# 九、分块 LLM 文档生成配置（anchored blog pipeline）
# ═══════════════════════════════════════════════════════════════════

[chunking]
# 每个 chunk 对应的视频时长（分钟）。推荐 5-10：
#   5 = 最接近逐句润色，适合公式/代码密集的课
#   10 = 普通课程默认值，保留更多上下文但 prompt 仍然足够短
# 长视频（3-4 小时）建议保持 5 或 10，chunk 越小单次 LLM 越稳。
segment_minutes = 5

# 每个 chunk 最多给文本/视觉模型看的候选帧数（10 分钟段建议 15-25）
max_images_per_chunk = 20

# 同时并行处理 chunk 的并发数（文本生成、补帧、视觉验图整体受限）
# 建议先按 CPU 核数/API 限流取平衡；纯 API 等待型负载通常 5-10 即可。
concurrency = 5

# chunk 并行后端：
#   async   = 单进程 asyncio 并发（默认，适合网络等待型负载，开销小）
#   process = 每个 chunk 一个子进程（真正多核；适合 pHash/编码等 CPU 密集负载）
parallel_mode = "process"

[doc_gen]
# SRT 式 + 插图 的输出文件名（保留 SRT 原结构，在对应段后插入图片引用）
srt_filename = "srt_picture.md"

# 博客式 + 插图 的输出文件名（BlogGenerator 生成的博客 markdown + 图片）
blog_filename = "blog.md"

[heuristic]
# 启发式截帧：场景检测阈值（0.0-1.0，越小越敏感）
scene_threshold = 0.4

# 启发式截帧：pHash 去重阈值（> 此值视为重复）
similarity_threshold = 0.7

# 启发式截帧：最大候选帧数（去重前上限）
max_frames = 25

# ── 博客锚点流水线配置（blog-anchor-pipeline）
[blog_gen]
# 文本模型请求的时间戳与已有候选帧的匹配容差（秒）
frame_match_tolerance = 2.0

# 视觉模型 retake 补截的最大轮数
max_retakes = 1

# 文本模型最多调用次数（总次数，含首次）。
# 例如 3 = 首次失败后最多再修/重试 2 次。
max_calls = 3

# 文本模型单次响应的最大 token 数。
# 10 分钟密集字幕的“完整讲稿 + JSON”很容易超过旧默认 8192，
# 被截断后会导致整个 chunk 降级成原始字幕。
# 注意：不能超过模型支持上限；MiniMax-M3 的 Anthropic 兼容端点是 524288。
max_tokens = 524288

# 视觉模型最多调用次数（总次数，含首次）。
# 例如 3 = 首次失败后最多再修/重试 2 次。
vision_max_calls = 3

# 视觉验图单次响应的最大 token 数。
# 每张图要输出 keep/retake/caption/text_representation 等字段，4096 容易截断。
# Qwen3-VL-8B-Instruct 的上限是 16384。
vision_max_tokens = 32768

# 视觉验图每次请求最多带多少张图。
# 一次看 20 张图时模型经常漏决策；拆成小批能显著提高 JSON 完整率。
vision_batch_size = 8

# 文本/视觉模型失败时是否把每次尝试的原始响应写到
# output/<任务名>/temp/raw_responses.jsonl，便于事后诊断。
# run-report.json 的 fallbacks[].detail.raw_dump_path 会同步给出该路径。
dump_raw_responses = true

# 仅在模型生成失败时记录（推荐）。设为 true 时成功响应也落盘，
# 适合需要审计模型输出质量或 A/B 评测的场景。
dump_raw_on_success = false

